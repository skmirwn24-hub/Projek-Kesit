<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siswa - KESIT Management</title>
  <link rel="stylesheet" href="siswa.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">
      <div class="logo">K</div>

      <div>
        <h2>KESIT</h2>
        <span>Management</span>
      </div>
    </div>

    <nav>
      <a href="dashboard.html" class="menu">Dashboard</a>
      <a href="siswa.html" class="menu active">Siswa</a>
      <a href="#" class="menu">Pelatih</a>
      <a href="#" class="menu">Jadwal</a>
      <a href="#" class="menu">Absensi</a>
      <a href="#" class="menu">Laporan Siswa</a>
      <a href="#" class="menu">Paket & Pembayaran</a>
      <a href="#" class="menu">Keuangan & Kas</a>
      <a href="riwayat.html" class="menu">Riwayat</a>
      <a href="#" class="menu">Pengaturan</a>
    </nav>

    <button class="logout" onclick="logout()">Keluar</button>

  </aside>


  <main class="main">

    <header class="topbar">

      <div>
        <h1>Data Siswa</h1>
        <p>Kelola data siswa KESIT Management</p>
      </div>

      <button class="primary" onclick="bukaFormTambah()">
        + Tambah Siswa
      </button>

    </header>


    <section class="panel">

      <input
        type="text"
        id="cariSiswa"
        class="search"
        placeholder="Cari ID, nama lengkap, atau nama panggilan..."
      >

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>ID Siswa</th>
              <th>Nama Lengkap</th>
              <th>Panggilan</th>
              <th>Jenis Kelamin</th>
              <th>Kelas</th>
              <th>Pelatih</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>

          <tbody id="tabelSiswa"></tbody>

        </table>

      </div>

    </section>

  </main>

</div>


<div id="modalSiswa" class="modal">

  <div class="modal-card">

    <div class="modal-header">

      <h2 id="judulForm">Tambah Siswa</h2>

      <button class="close" onclick="tutupForm()">
        ×
      </button>

    </div>


    <form id="formSiswa">

      <input type="hidden" id="editIndex">


      <div class="form-grid">

        <label>
          Nama Lengkap

          <input
            type="text"
            id="namaLengkap"
            required
          >
        </label>


        <label>
          Nama Panggilan

          <input
            type="text"
            id="namaPanggilan"
            required
          >
        </label>


        <label>
          Jenis Kelamin

          <select id="jenisKelamin">

            <option value="Laki-laki">
              Laki-laki
            </option>

            <option value="Perempuan">
              Perempuan
            </option>

          </select>

        </label>


        <label>
          Tempat Lahir

          <input
            type="text"
            id="tempatLahir"
          >
        </label>


        <label>
          Tanggal Lahir

          <input
            type="date"
            id="tanggalLahir"
          >
        </label>


        <label>
          Nama Wali

          <input
            type="text"
            id="namaWali"
          >
        </label>


        <label>
          Nomor HP Wali

          <input
            type="text"
            id="noHpWali"
          >
        </label>


        <label>
          Kelas

          <select id="kelas">

            <option value="Reguler Pemula">
              Reguler Pemula
            </option>

            <option value="Reguler Pra Prestasi">
              Reguler Pra Prestasi
            </option>

            <option value="Private Pemula">
              Private Pemula
            </option>

            <option value="Private Pra Prestasi">
              Private Pra Prestasi
            </option>

            <option value="Prestasi">
              Prestasi
            </option>

          </select>

        </label>


        <label>
          Pelatih Pemilik

          <input
            type="text"
            id="pelatihPemilik"
            placeholder="Contoh: Andi"
          >
        </label>


        <label>
          Pelatih Diminta

          <input
            type="text"
            id="pelatihDiminta"
            placeholder="Kosongkan jika tidak request"
          >
        </label>


        <label>
          Status

          <select id="status">

            <option value="Aktif">
              Aktif
            </option>

            <option value="Tidak Aktif">
              Tidak Aktif
            </option>

          </select>

        </label>

      </div>


      <button
        type="submit"
        class="primary full"
      >
        Simpan
      </button>

    </form>

  </div>

</div>


<div id="modalDetail" class="modal">

  <div class="modal-card detail-card">

    <div class="modal-header">

      <h2>Detail Siswa</h2>

      <button
        class="close"
        onclick="tutupDetail()"
      >
        ×
      </button>

    </div>

    <div id="isiDetail"></div>

  </div>

</div>


<script src="siswa.js"></script>

</body>
</html>
